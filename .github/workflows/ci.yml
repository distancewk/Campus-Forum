name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: campus_forum
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run backend tests
        working-directory: campus-forum-backend
        run: mvn -q test
        env:
          DB_PASSWORD: testpass

  frontend:
    runs-on: ubuntu-latest
    # Package manager detected from repo: package-lock.json present -> npm
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: campus-forum-frontend-new/package-lock.json
      - name: Install dependencies
        run: npm -C campus-forum-frontend-new install
      # NOTE: no `lint` script exists in package.json; skipped to avoid CI failure.
      - name: Run frontend tests
        run: npm -C campus-forum-frontend-new test
