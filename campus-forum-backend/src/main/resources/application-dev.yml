spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/campus_forum
    username: postgres
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      password: ${REDIS_PASSWORD:}
  mail:
    host: smtp.xxx.edu.cn
    port: 465
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail.smtp.ssl.enable: true

campus:
  jwt:
    access-secret: ${JWT_ACCESS_SECRET}
    access-expiration: 7200000       # 2 hours (ms)
    refresh-secret: ${JWT_REFRESH_SECRET}
    refresh-expiration: 604800000    # 7 days (ms)
    access-ttl: 900
    refresh-ttl: 604800
  redis:
    rt-prefix: "campus:rt:"
  otp:
    ttl: 300
    max-attempts: 5
    resend-seconds: 60
  upload:
    path: ./uploads/
    base-url: http://localhost:8080
    allowed-types: image/jpeg,image/png,image/gif,image/webp
    max-size: 5242880                # 5MB (bytes)
  email:
    expire: 300                      # verification code expiry (seconds)
  docs:
    enabled: true
  cookie:
    secure: false
  cors:
    allowed-origins: http://localhost:5173,http://localhost:8080
  school-email-domain: "@your-school.edu.cn"
  ai:
    enabled: true                 # 本地 dev 启用真实 AI 审核（接入阿里云百炼）
    base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
    chat-model: qwen-plus
    moderation-enabled: true      # 恢复 AI 审核（api-key 通过 .env 的 CAMPUS_AI_API_KEY 注入）
    moderation:
      prompt-cache-ttl-seconds: 3600   # 复用固定系统提示前缀，省 token/延迟
      cache-ttl-seconds: 600           # 相同内容 10 分钟内复用审核结果
      rate-limit-per-user: 30          # 单用户每分钟审核上限
      rate-limit-global: 300           # 全局每分钟审核上限（成本封顶近似）
  admin:
    student-no: ${CAMPUS_ADMIN_STUDENT_NO:admin001}
    email: ${CAMPUS_ADMIN_EMAIL:}
    password: ${CAMPUS_ADMIN_PASSWORD:}
