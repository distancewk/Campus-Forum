server:
  port: 8080

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 20MB
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  config: classpath:log4j2.xml

campus:
  ai:
    enabled: ${CAMPUS_AI_ENABLED:false}
    base-url: ${CAMPUS_AI_BASE_URL:https://api.openai.com/v1}
    api-key: ${CAMPUS_AI_API_KEY:}
    chat-model: ${CAMPUS_AI_CHAT_MODEL:gpt-4o-mini}
    embedding-model: ${CAMPUS_AI_EMBEDDING_MODEL:text-embedding-3-small}
    embedding-dimension: ${CAMPUS_AI_EMBEDDING_DIMENSION:1536}
    timeout-ms: ${CAMPUS_AI_TIMEOUT_MS:15000}
    qa:
      max-sources: ${CAMPUS_AI_QA_MAX_SOURCES:6}
      min-score: ${CAMPUS_AI_QA_MIN_SCORE:0.32}
      rate-limit-per-hour: ${CAMPUS_AI_QA_RATE_LIMIT_PER_HOUR:30}
    moderation-enabled: ${CAMPUS_AI_MODERATION_ENABLED:true}
    moderation-medium-threshold: ${CAMPUS_AI_MODERATION_MEDIUM_THRESHOLD:0.55}
    moderation-high-threshold: ${CAMPUS_AI_MODERATION_HIGH_THRESHOLD:0.82}
    moderation:
      mode: ${CAMPUS_AI_MODERATION_MODE:post}
      cache-enabled: ${CAMPUS_AI_MODERATION_CACHE_ENABLED:true}
      cache-ttl-seconds: ${CAMPUS_AI_MODERATION_CACHE_TTL:600}
      rate-limit-per-user: ${CAMPUS_AI_MODERATION_RL_USER:20}
      rate-limit-global: ${CAMPUS_AI_MODERATION_RL_GLOBAL:200}
      rate-limit-window-seconds: ${CAMPUS_AI_MODERATION_RL_WINDOW:60}
      prompt-cache-ttl-seconds: ${CAMPUS_AI_MODERATION_PROMPT_CACHE_TTL:0}
    document:
      max-file-size: ${CAMPUS_AI_DOCUMENT_MAX_FILE_SIZE:10485760}
  docs:
    enabled: ${CAMPUS_DOCS_ENABLED:false}
  cors:
    allowed-origins: ${CAMPUS_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8080}
  upload:
    base-url: ${CAMPUS_UPLOAD_BASE_URL:}
  school-email-domain: ${CAMPUS_SCHOOL_EMAIL_DOMAIN:@your-school.edu.cn}
  cookie:
    secure: ${CAMPUS_COOKIE_SECURE:true}
    same-site: ${CAMPUS_COOKIE_SAME_SITE:Lax}
  admin:
    student-no: ${CAMPUS_ADMIN_STUDENT_NO:admin001}
    email: ${CAMPUS_ADMIN_EMAIL:}
    password: ${CAMPUS_ADMIN_PASSWORD:}
  jwt:
    access-ttl: 900
    refresh-ttl: 604800
  redis:
    rt-prefix: "campus:rt:"
  otp:
    ttl: 300
    max-attempts: 5
    resend-seconds: 60
